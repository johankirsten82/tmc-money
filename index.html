      python3 tools/apply_config.py
  (it writes manifest.json, sw.js cache/version, icons and the QR code).

          Every storage key, cache, manifest id and SW is namespaced by it,
          so apps on the same site / same phone never share data.
  CACHE_PREFIX (optional): cache name start, lowercase letters/digits and
          single hyphens (e.g. "tmc-fuel" gives caches "tmc-fuel-v1").
          Defaults to APP_ID. Storage keys always use APP_ID (no hyphens).
  SYNC_URL: this app's own Google Apps Script /exec link. Put it HERE so a
          fresh install is connected at once (the link is public, that's fine).
  SYNC_CODE: leave EMPTY (VER 4+). Phones then sign in with name + PIN and
          get a session token from the script. A code is only for old apps;
          it can also arrive by a join link  .../#k=CODE  (saved, then wiped
          from the address bar). Never put a real code in a public repo.
  ADMIN_ALIASES: name keys (lowercase, no spaces/dots) that mean the Admin.

    return relog}

  const keys=Object.keys(dirty),sent={};

function discardWhy(u){if(isMain(u))return "dscMain";const m=me();if(!m||!m.admin)return "dscTok";if(u.id===m.id)return "dscSelf";

  const k="u:"+id;R[k]={kind:"u",id:String(id),u:Math.max(Date.now(),R[k]?R[k].u+1:0),del:1,data:{discarded:1,at:new Date().toISOString()}};dirty[k]=1;saveR();syncSoon();
  if(openU===id)openU=null;toast(t("dscDone").replace("%n",u.name));render();return true}

   locks saves (put() refuses), shows a full-screen "Updating… please wait", activates the new worker and reloads.
   Offline / check fails: nothing happens, the app works normally, it tries again next open. Saved records live in

  setTimeout(()=>{if(updLock&&!(reg&&reg.waiting)&&Date.now()-updT0>=45000)updOff()},45000)}   // download stuck: let staff work, retry next open

  const hook=r=>{if(!r||reg)return;reg=r;   // ready answers at once when installed; register() can wait for the network
    const watch=w=>{if(!w||!navigator.serviceWorker.controller)return;updOn();w.addEventListener("statechange",()=>{if(w.state==="installed"){updReady=true;paintUpd();applyUpdate()}else if(w.state==="redundant"&&!r.waiting)updOff()})};

  function scan(root){if(!root||!root.querySelectorAll)return;if(root.matches&&root.matches("input,textarea"))fix(root);root.querySelectorAll("input,textarea").forEach(fix)}
  window.TMC_spell=scan;
  function go(){scan(document.body);new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(scan)})}).observe(document.body,{childList:true,subtree:true})}
  if(document.body)go();else document.addEventListener("DOMContentLoaded",go);
})();
/* SPELLCHECK END */
</script>
