          so apps on the same site / same phone never share data.
  CACHE_PREFIX (optional): cache name start, lowercase letters/digits and
          single hyphens (e.g. "tmc-fuel" gives caches "tmc-fuel-v1").

          fresh install is connected at once (the link is public, that's fine).

          get a session token from the script. A code is only for old apps;
          it can also arrive by a join link  .../#k=CODE  (saved, then wiped
          from the address bar). Never put a real code in a public repo.
  ADMIN_ALIASES: name keys (lowercase, no spaces/dots) that mean the Admin.
====================================================================== -->

/* ---------------- Records + sync ---------------- */
let R=L.j("recs",{}),dirty=L.j("dirty",{});
let dev=L.get("dev");if(!dev){dev="d"+Math.random().toString(36).slice(2,10);L.set("dev",dev)}
const saveR=()=>{L.sj("recs",R);L.sj("dirty",dirty)};
const all=kind=>Object.keys(R).map(k=>R[k]).filter(r=>r.kind===kind&&!r.del).map(r=>r.data);
/* ADMIN FIX RULE: staff may only ADD. Changing/deleting an existing record (not "u") is Admin-only; the server enforces it too. */
/* PERMISSIONS: the Admin ticks what each person may do (CONFIG.PERMS). Admin = everything. The server checks too. */
function permsOf(u){return u&&Array.isArray(u.perms)?u.perms:(C.PERM_DEFAULT||[])}
function can(p,u){u=u||me();return !!u&&(!!u.admin||permsOf(u).indexOf(p)>=0)}
function canKind(kind,what,u){const k=(C.PERM_KINDS||{})[kind];return !k||!k[what]||can(k[what],u)}
function permLab(p){return p[lang]||p.en}
function canFix(){const m=me();return !!(m&&m.admin)}
function put(kind,id,data){const k=kind+":"+id;if(kind!=="u"&&R[k]&&!R[k].del&&!canFix()){alert(t("fixOnly"));return false}if(kind!=="u"&&!R[k]&&!canKind(kind,"add")){alert(t("noAccess"));return false}const u=Math.max(Date.now(),R[k]?R[k].u+1:0);R[k]={kind:kind,id:String(id),u:u,del:0,data:data};dirty[k]=1;saveR();syncSoon();}
function remove(kind,id){const k=kind+":"+id;if(kind==="u")return false;if(kind!=="u"&&!canFix()){alert(t("fixOnly"));return false}const u=Math.max(Date.now(),R[k]?R[k].u+1:0);R[k]={kind:kind,id:String(id),u:u,del:1,data:null};dirty[k]=1;saveR();syncSoon();}
/* fix(): Admin changes one field; old value, Admin name and time are kept in data._fix (audit column) and the server "Fix log" tab. */
function fix(kind,id,field,val){if(!canFix())return false;const k=kind+":"+id,r=R[k];if(!r||r.del)return false;const d=Object.assign({},r.data),old=d[field];if(String(old)===String(val))return true;
  d._fix=(Array.isArray(d._fix)?d._fix:[]).concat([{f:field,old:old,by:me().name,at:new Date().toISOString()}]);d[field]=val;return put(kind,id,d)!==false}
function fixBtn(kind,id,field){return canFix()?`<button type="button" class="fixB" data-k="${esc(kind)}" data-i="${esc(id)}" data-f="${esc(field)}">${esc(t("fix"))}</button>`:""}
function fixedNote(d){const f=d&&Array.isArray(d._fix)&&d._fix[d._fix.length-1];return f?`<span class="hint fixN">✏️ ${esc(t("fixed"))} ${esc(f.by)} · ${esc(String(f.at).slice(0,16).replace("T"," "))}</span>`:""}
function bindFix(){if(!canFix())return;document.querySelectorAll(".fixB").forEach(b=>b.onclick=()=>{const kind=b.dataset.k,id=b.dataset.i,f=b.dataset.f,r=R[kind+":"+id];if(!r)return;
  const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card"><h2>${esc(t("fixT"))}</h2><textarea id="fixV" rows="3" spellcheck="true" autocorrect="on"></textarea><button type="button" id="fixS">${esc(t("fixSave"))}</button><button type="button" class="sec" id="fixX">${esc(t("close"))}</button></div>`;
  document.body.appendChild(m);$("fixV").value=r.data[f]==null?"":String(r.data[f]);const x=()=>m.remove();$("fixX").onclick=x;

const sUrl=()=>L.get("syurl")||C.SYNC_URL,sCode=()=>L.get("sycode")||C.SYNC_CODE;
const sTok=()=>L.get("tok")||"";
const tokMode=()=>!!(sUrl()&&!sCode());           // VER 4: no code → name+PIN session token
const syncOn=()=>!!(sUrl()&&(sCode()||sTok()));
let netBad=false;                                   // true only when the server can't be reached or rejects us
function api(body){return fetch(sUrl(),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({device:dev},body))})
  .then(r=>r.json()).then(j=>{netBad=false;paintSync();return j},e=>{netBad=true;paintSync();throw e})}
window.TMC.api=api;
const pending=()=>Object.keys(dirty).length;
let sState="",busy=null,tmr=null,fails=0;
function syncSoon(ms){clearTimeout(tmr);tmr=setTimeout(()=>syncNow(),ms==null?800:ms)}
let relog=null;
function syncNow(){
  // token phone signed in offline (or token lost): get a new token with this phone's own stored PIN hash
  if(tokMode()&&!sTok()){const u=me();if(!u||!u.pinH)return Promise.resolve(false);
    if(!relog)relog=api({action:"login",id:u.id,pinH:u.pinH}).then(j=>{relog=null;if(j&&j.ok){L.set("tok",j.token);return syncNow()}if(j&&j.error!=="locked"){signOut();render()}return false},()=>{relog=null;syncSoon(30000);return false});
    return relog}
  if(!syncOn())return Promise.resolve(false);
  if(busy)return busy;
  const keys=Object.keys(dirty),sent={};
  const changes=keys.map(k=>{const r=R[k];sent[k]=r.u;return {kind:r.kind,id:r.id,u:r.u,del:r.del,data:r.data}});
  sState="busy";paintSync();
  busy=fetch(sUrl(),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"sync",code:sCode()||undefined,token:sCode()?undefined:sTok(),device:dev,since:+(L.get("since")||0),changes:changes})})
  .then(r=>r.json()).then(j=>{
    if(j&&!j.ok&&(j.error==="bad_token"||j.error==="not_active")&&!sCode()){L.del("tok")}
    if(!j||!j.ok)throw new Error(j&&j.error||"sync");
    Object.keys(sent).forEach(k=>{if(R[k]&&R[k].u===sent[k])delete dirty[k]});
    (j.records||[]).forEach(s=>{const k=s.kind+":"+s.id,u=+s.u||0,loc=R[k];if(loc&&(loc.u>u||(dirty[k]&&loc.u>=u)))return;
      let d=s.data;if(typeof d==="string"){try{d=d?JSON.parse(d):null}catch(e){d=null}}if(s.kind==="u"&&(s.del||!d)&&loc&&!loc.del)return;R[k]={kind:s.kind,id:String(s.id),u:u,del:s.del?1:0,data:d}});
    L.set("since",String(j.now||Date.now()));L.set("lastOk",String(Date.now()));saveR();fails=0;sState="ok";netBad=false;return true})
  .catch(e=>{fails++;sState="err";netBad=true;syncSoon(navigator.onLine?Math.min(120000,5e3*Math.pow(2,fails-1)):60000);return false})
  .then(ok=>{busy=null;paintSync();try{onData()}catch(e){console.warn(e)}if(ok&&pending())syncSoon(300);return ok});
  return busy;
}
/* Restore a backup: MERGES records only. Never removes users or any record; a backup with no users keeps the current users. */
function restoreBackup(b){const recs=Array.isArray(b)?b:(b&&(b.records||b.R))||[];const list=Array.isArray(recs)?recs:Object.keys(recs).map(k=>recs[k]);let n=0;
  list.forEach(s=>{if(!s||!s.kind||s.id==null||s.del)return;let d=s.data;if(typeof d==="string"){try{d=JSON.parse(d)}catch(e){return}}if(d==null||typeof d!=="object")return;
    const k=s.kind+":"+s.id,loc=R[k];if(loc&&!loc.del&&(+s.u||0)<=loc.u)return;if(s.kind==="u"&&loc&&!loc.del)return;
    R[k]={kind:s.kind,id:String(s.id),u:Math.max(+s.u||0,loc?loc.u+1:0),del:0,data:d};dirty[k]=1;n++});
  saveR();syncSoon();return n}
window.TMC.restoreBackup=restoreBackup;
window.TMC.syncNow=syncNow;window.TMC.pending=pending;

function me(){const id=L.get("uid"),ok=L.get("uok");if(!id||!ok)return null;const u=users().find(x=>x.id===id);if(!u||!approved(u)||ok!==u.id+":"+u.pinH)return null;return u}

/* VER 4 token flow: ask the script who this name is (works on a fresh phone with no code) */
async function startName(raw){
  const name=clean(raw);if(!name)return err(t("needName"));
  L.set("lastName",name);
  if(tokMode())return srvLookup(name,true);
  // fresh phone / reinstall: pull everything from the Sheet BEFORE matching the name
  if(syncOn()&&!(+(L.get("since")||0)>0)){flow={s:"loading",name:name};render();await syncNow();
    if(!(+(L.get("since")||0)>0)&&!users().length){flow={s:"net",name:name};render();return}}
  lookup(name);
}
async function srvLookup(name,reg){
  flow={s:"loading",name:name};render();
  let j;try{j=await api({action:"status",name:name});if(j&&j.ok&&j.state==="none"&&reg)j=await api({action:"register",name:name})}catch(e){j=null}
  if(!j||!j.ok){if(users().length)return lookup(name,true);flow={s:"net",name:name};return render()}
  const st=j.state;
  if(st==="active"){const u=users().find(x=>x.id===j.id)||{id:j.id,name:j.name};flow={s:j.hasPin?"pin":"set",u:Object.assign({},u,{name:j.name,salt:j.salt||u.salt}),name:name,srv:1};return render()}
  if(st==="setup"){flow={s:"set",setup:true,u:{id:"",name:C.ADMIN_NAME},name:name,srv:1};return render()}
  if(st==="blocked"){flow={s:"blk",name:name};return render()}
  if(st==="rejected"){flow={s:"rej",name:name};return render()}
  if(st==="dup"||(st==="pending"&&j.other)){flow={s:"dup",name:name,srv:1};return render()}  // ONE request per name per app
  flow={s:"wait",name:name,srv:1};render();
}
async function gotToken(j,u){
  L.set("tok",j.token);L.del("since");await syncNow();
  const me_=users().find(x=>x.id===j.id);
  if(!me_){flow={s:"net",name:flow&&flow.name};return render()}
  L.set("uid",me_.id);L.set("uok",me_.id+":"+me_.pinH);tab="home";flow=null;render();
}
function lookup(name,localOnly){
  if(tokMode()&&!localOnly)return srvLookup(name,true);
  const K=NK(name),all_=users().filter(u=>NK(u.name)===K),ok=all_.filter(approved);
  if(ok.length===1){if(tokMode()&&!ok[0].pinH){flow={s:"net",name:name};return render()}  // token phones only hold their own PIN hash
    flow={s:ok[0].pinH?"pin":"set",u:ok[0],name:name};return render()}
  if(ok.length===0){
    if(all_.some(u=>u.status==="blocked")){flow={s:"blk",name:name};return render()}
    if(all_.some(u=>u.status==="rejected")){flow={s:"rej",name:name};return render()}
    if(!hasAdmin()&&K===ADMIN_KEY){flow={s:"set",setup:true,u:{id:"u"+Date.now(),name:C.ADMIN_NAME,status:"active",admin:1,dev:dev,at:new Date().toISOString()},name:name};return render()}
  }
  // no single approved match (none, or 2+ sharing the key): a normal approval request
  if(tokMode()){flow={s:"net",name:name};return render()}  // token phones register on the server only
  const own=users().find(u=>u.status==="pending"&&NK(u.name)===K&&(ok.length<2||(u.dev===dev&&clean(u.name).toLowerCase()===name.toLowerCase())));
  if(!own&&ok.length<2&&users().some(u=>NK(u.name)===K&&(u.status==="pending"||u.status==="active"))){flow={s:"dup",name:name};return render()}  // ONE request per name per app
  if(!own){const r={id:"r"+Date.now(),name:name,status:"pending",dev:dev,at:new Date().toISOString()};put("u",r.id,r)}
  flow={s:"wait",name:name};render();
}
async function checkPin(){
  const u=flow.u,k=NK(u.name),v=$("fPin").value;
  let F=fails_(k);
  if(F.length>=5){$("fPin").value="";return err(t("pinLock").replace("%m",Math.max(1,Math.ceil((F[0]+36e5-Date.now())/6e4))))}
  if(flow.srv&&navigator.onLine){let j=null;try{j=await api({action:"login",id:u.id,pinH:await H(v,u.salt)})}catch(e){}
    if(j&&j.ok){clearFail(k);return gotToken(j,u)}
    if(j){addFail(k);$("fPin").value="";return err(j.error==="locked"?t("pinLock").replace("%m",Math.max(1,Math.ceil(((j.until||Date.now()+36e5)-Date.now())/6e4))):t("pinWrong"))}}
  if(u.pinH&&await H(v,u.salt)===u.pinH){clearFail(k);L.set("uid",u.id);L.set("uok",u.id+":"+u.pinH);tab="home";flow=null;render();return}
  addFail(k);F=fails_(k);$("fPin").value="";
  err(F.length>=5?t("pinLock").replace("%m",60):t("pinWrong"));
}
async function setPin(){

  put("u",u.id,u);L.set("uid",u.id);L.set("uok",u.id+":"+u.pinH);tab="home";flow=null;render();
}

function insHTML(){if(standalone())return "";if(bip)return `<button type="button" class="insB">${esc(t("insBtn"))}</button>`;if(isIos())return `<div class="insH">${esc(t("insIos"))}</div>`;return ""}
function bindIns(){document.querySelectorAll(".insB").forEach(b=>b.onclick=async()=>{if(!bip)return;bip.prompt();try{await bip.userChoice}catch(e){}bip=null;render()})}

/* ---------------- Share app + QR ---------------- */
function shareModal(){
  const url=C.SHARE_URL||new URL("./",location.href).href;
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="card"><h2>📤 ${esc(t("share"))}</h2>${C.SHARE_URL?`<img class="qr" src="icons/qr.png" alt="QR">`:""}<p class="hint">${esc(t("shareH"))}</p><p style="word-break:break-all"><b>${esc(url)}</b></p>
  ${navigator.share?`<button type="button" id="shS">${esc(t("shareB"))}</button>`:""}<button type="button" class="sec" id="shC">${esc(t("copy"))}</button><button type="button" class="sec" id="shX">${esc(t("close"))}</button></div>`;
  document.body.appendChild(m);
  const x=()=>m.remove();$("shX").onclick=x;m.onclick=e=>{if(e.target===m)x()};
  if($("shS"))$("shS").onclick=()=>navigator.share({title:C.NAME,url:url}).catch(()=>{});
  $("shC").onclick=()=>{try{navigator.clipboard.writeText(url).then(()=>{$("shC").textContent=t("copied")})}catch(e){}};
}

render();

})();
/* SPELLCHECK START — phone spellcheck on every free-text box (names, items, notes).
   Never on PIN / number / sync / code / masked fields. Covers boxes built later too. */
(function(){
  var SKIP=/pin|url|code|sync|pass|qty|price|amount|num|date|email|phone|tel/i;
  function want(el){
    if(el.hasAttribute("data-nospell")||el.classList.contains("msk")||el.classList.contains("mk")||el.readOnly||(el.getAttribute("autocapitalize")||"")==="characters")return false;
    if(el.tagName==="TEXTAREA")return true;
    var ty=(el.getAttribute("type")||"text").toLowerCase();
    if(ty!=="text"&&ty!=="search")return false;
    var im=(el.getAttribute("inputmode")||"").toLowerCase();
    if(im==="numeric"||im==="decimal"||im==="tel"||im==="email"||im==="url")return false;
    if(SKIP.test((el.id||"")+" "+(el.name||"")+" "+(el.className||"")))return false;
    return true;
  }
  function fix(el){
    if(!want(el)){if(el.tagName==="INPUT"||el.tagName==="TEXTAREA"){el.spellcheck=false;el.setAttribute("spellcheck","false")}return}
    el.spellcheck=true;el.setAttribute("spellcheck","true");el.setAttribute("autocorrect","on");
    var nm=/name|who/i.test((el.id||"")+" "+(el.name||""))&&el.tagName!=="TEXTAREA";
    el.setAttribute("autocapitalize",nm?"words":"sentences");
  }
  function scan(root){if(!root||!root.querySelectorAll)return;if(root.matches&&root.matches("input,textarea"))fix(root);root.querySelectorAll("input,textarea").forEach(fix)}
  window.TMC_spell=scan;
  function go(){scan(document.body);new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(scan)})}).observe(document.body,{childList:true,subtree:true})}
  if(document.body)go();else document.addEventListener("DOMContentLoaded",go);
})();
/* SPELLCHECK END */
